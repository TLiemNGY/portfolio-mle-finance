[project]
name = "portfolio-mle-finance"
version = "0.1.0"
description = "Portfolio copilot: market data ingestion into BigQuery, volatility forecasting (LightGBM), and a LangGraph agent served via FastAPI."
authors = [
    { name = "TLiemNGY", email = "thanh-liem.nguyen.2023@polytechnique.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "db-dtypes>=1.7.1",
    "fastapi>=0.141.1",
    "google-cloud-bigquery>=3.45.0",
    "google-cloud-storage>=3.15.0",
    "joblib>=1.6.0",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.53.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
analysis = [
    "matplotlib>=3.11.2",
]
dev = [
    "commitizen>=4.18.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
ui = [
    "streamlit>=1.65.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
