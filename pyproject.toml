[project]
name = "portfolio-mle-finance"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "TLiemNGY", email = "thanh-liem.nguyen.2023@polytechnique.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "gdeltdoc>=1.12.0",
    "google-cloud-bigquery>=3.45.0",
    "google-cloud-storage>=3.14.1",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "pandas-gbq>=0.35.2",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "unidecode>=1.4.0",
    "yfinance>=1.7.0",
]

[project.scripts]
portfolio-mle-finance = "portfolio_mle_finance:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
